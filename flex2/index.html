<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>Flex-direction</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <p>Размещение флекс элементов в перевернутом ряду в CSS</p>
        <p>Значение row-reverse в свойстве flex-direction позволяет выстраивать блоки в ряд, прижимая их к правому краю. При этом происходит переворот порядка - первый блок будет самым правым:</p>

        <div class="parent">
            <div class="child">1</div>
            <div class="child">2</div>
            <div class="child">3</div>
        </div>
    </body>
</html>
