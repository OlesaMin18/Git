<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Практические задачи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Практические задачи</h1>
    <p>Элементы внутри блоков расположены с помощью позиционирования.</p>

    <h2>№1</h2>
    <div id="zadanie1">
        <div id="greenBorder"></div>
        <div id="redSquare"></div>
    </div>

    <h2>№2</h2>
    <div id="zadanie2">
        <div id="greenSquare"></div>
        <div id="whiteSquare1"></div>
        <div id="whiteSquare2"></div>
    </div>

    <h2>№3</h2>
    <div id="zadanie3">
        <div id="trafficLight">
            <div id="redLight"></div>
            <div id="yellowLight"></div>
            <div id="greenLight"></div>
        </div>
    </div>

    <h2>№4</h2>
    <div id="zadanie4">
        <div id="face">
            <div id="eye1"></div>
            <div id="eye2"></div>
            <div id="nose"></div>
            <div id="mouth"></div>
        </div>
    </div>

    <h2>№5</h2>
    <div id="zadanie5">
        <div id="smileFace">
            <div id="eye3"></div>
            <div id="eye4"></div>
            <div id="nose2"></div>
            <div id="smile"></div>
        </div>
    </div>
</body>
</html>
