<!DOCTYPE html>
<html lang="ru">

    <title>Свойство float</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>№1</h2>
    <div class="parent">
        <div class="child">text 1</div>
        <div class="child">text 2</div>
        <div class="child">text 3</div>
        <div class="child">text 4</div>
        <div class="child">text 5</div>

    <h2>№2</h2>

        <div class="child right">text 1</div>
        <div class="child right">text 2</div>
        <div class="child right">text 3</div>
        <div class="child right">text 4</div>
        <div class="child right">text 5</div>
        <div class="clearfix"></div>
    </div>
</body>
</html>
